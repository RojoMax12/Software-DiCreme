version: '3.8'

services:
  # Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: dicreme-db
    restart: always
    environment:
      MYSQL_DATABASE: db_dicreme
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: dicreme_user
      MYSQL_PASSWORD: dicreme_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - dicreme-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servidor Backend (Laravel 11 REST API)
  backend:
    build:
      context: ./backend-dicreme
      dockerfile: Dockerfile
    container_name: dicreme-backend
    restart: always
    environment:
      APP_NAME: DiCreme
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: db_dicreme
      DB_USERNAME: dicreme_user
      DB_PASSWORD: dicreme_password
      FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8000:80"
    volumes:
      - ./backend-dicreme/storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dicreme-network

  # Servidor Frontend (Vue 3 SPA en Nginx)
  frontend:
    build:
      context: ./frontend-dicreme
      dockerfile: Dockerfile
    container_name: dicreme-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - dicreme-network

networks:
  dicreme-network:
    driver: bridge

volumes:
  db_data:
